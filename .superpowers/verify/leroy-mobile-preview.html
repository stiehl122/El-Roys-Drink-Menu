<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Leroy Mobile Preview</title>
<link rel="stylesheet" href="/style.css?v=mobilecheck4">
<link rel="stylesheet" href="/leroyslounge/style.css?v=mobilecheck4">
</head>
<body class="route-restaurant route-restaurant--leroy">
  <div id="restaurant-site-wrapper">
    <div class="ll-marquee-page ll-board-page">
      <div class="ll-marquee-shell">
        <section class="ll-marquee-rail" aria-label="Leroy's Lounge menu controls and venue details">
          <div class="ll-marquee-sign">
            <div class="ll-marquee-sign-top">
              <p class="ll-marquee-kicker">Current Menu</p>
              <a class="ll-board-logo-btn ll-board-logo-btn--home" href="/" aria-label="Return to the homepage">
                <img class="ll-board-logo" src="/assets/leroys-lounge/stitch-logo.png" alt="Leroy's Lounge" width="495" height="335">
              </a>
            </div>
            <p class="ll-marquee-copy">Late-night plates, steady pours, and the kind of room that still feels warm after midnight.</p>
            <p class="ll-marquee-copy-short">Late-night plates. Steady pours.</p>
          </div>

          <div class="ll-rail-block">
            <p class="ll-rail-label">Board</p>
            <nav class="ll-menu-toggle" aria-label="Swap menu">
              <button class="ll-menu-toggle-btn" type="button">Food</button>
              <button class="ll-menu-toggle-btn is-active" type="button">Drinks</button>
            </nav>
          </div>

          <div class="ll-rail-block">
            <p class="ll-rail-label">Around The House</p>
            <div class="ll-board-action-cluster">
              <a class="ll-board-jump-link" href="/elroyscantina">El Roy's</a>
            </div>
          </div>

          <div class="ll-rail-meta">
            <div class="ll-rail-meta-card">
              <p class="ll-rail-label">Live Board</p>
              <p class="ll-rail-timestamp">Sat, Apr 19 at 10:57 PM</p>
            </div>
          </div>
        </section>

        <main class="ll-board-main" id="ll-route-main" tabindex="-1">
          <section class="ll-slat-section menu-category" data-category="special">
            <div class="ll-slat-section-head">
              <h2 class="ll-slat-section-title">Specials</h2>
            </div>
            <div class="ll-board-rows">
              <article class="ll-board-item menu-item">
                <div class="ll-board-row">
                  <div class="ll-board-item-main">
                    <div class="ll-board-item-name-wrap">
                      <h3 class="ll-board-item-name menu-item-name">Shot + Beer</h3>
                    </div>
                  </div>
                  <div class="ll-board-item-side">
                    <span class="ll-board-price menu-item-price">$9</span>
                  </div>
                </div>
              </article>
            </div>
          </section>

          <div id="ll-route-sections">
            <section class="ll-slat-section menu-category">
              <div class="ll-slat-section-head">
                <h2 class="ll-slat-section-title">Draft Beer</h2>
              </div>
              <div class="ll-board-rows">
                <article class="ll-board-item menu-item">
                  <div class="ll-board-row">
                    <div class="ll-board-item-main">
                      <div class="ll-board-item-name-wrap">
                        <h3 class="ll-board-item-name menu-item-name">Pabst Blue Ribbon</h3>
                      </div>
                    </div>
                    <div class="ll-board-item-side">
                      <span class="ll-board-price menu-item-price">$4</span>
                    </div>
                  </div>
                </article>
                <article class="ll-board-item menu-item">
                  <div class="ll-board-row">
                    <div class="ll-board-item-main">
                      <div class="ll-board-item-name-wrap">
                        <h3 class="ll-board-item-name menu-item-name">Miller High Life</h3>
                      </div>
                    </div>
                    <div class="ll-board-item-side">
                      <span class="ll-board-price menu-item-price">$4</span>
                    </div>
                  </div>
                </article>
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>
  </div>
</body>
</html>
