<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leroy Mobile Frame</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #17110f;
    color: #f0e1cb;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .frame-wrap {
    display: grid;
    gap: 12px;
    justify-items: center;
    padding: 24px;
  }
  .label {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    opacity: 0.8;
  }
  iframe {
    width: 390px;
    height: 844px;
    border: 0;
    border-radius: 28px;
    background: #120e0c;
    box-shadow: 0 24px 80px rgba(0,0,0,0.45);
  }
</style>
</head>
<body>
  <div class="frame-wrap">
    <div class="label">390 × 844 mobile frame</div>
    <iframe src="/.superpowers/verify/leroy-mobile-preview.html" title="Leroy mobile preview"></iframe>
  </div>
</body>
</html>
