name: iOS Launch Gate

on:
  pull_request:
  push:

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: read

jobs:
  xcode-cloud-gate:
    name: Xcode Cloud Gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect iOS changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            files="$(git diff --name-only "$base...$head")"
            ios_sha="$(git log -n 1 --format=%H "$base..$head" -- ios/ || true)"
          else
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            default_branch="${{ github.event.repository.default_branch }}"
            default_ref="origin/$default_branch"

            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              files="$(git diff-tree --no-commit-id --name-only -r "$after")"
              ios_sha="$(git log -n 1 --format=%H "$after" -- ios/ || true)"
            elif git cat-file -e "$before^{commit}" 2>/dev/null; then
              files="$(git diff --name-only "$before" "$after")"
              ios_sha="$(git log -n 1 --format=%H "$before..$after" -- ios/ || true)"
            else
              echo "Push before SHA $before is unavailable; falling back to $default_ref."
              fallback_base=""
              if git rev-parse --verify --quiet "$default_ref" >/dev/null; then
                fallback_base="$(git merge-base "$default_ref" "$after" || true)"
              fi

              if [ -n "$fallback_base" ]; then
                files="$(git diff --name-only "$fallback_base" "$after")"
                ios_sha="$(git log -n 1 --format=%H "$fallback_base..$after" -- ios/ || true)"
              else
                echo "No default branch merge base found; inspecting the pushed commit only."
                files="$(git diff-tree --no-commit-id --name-only -r "$after")"
                ios_sha="$(git log -n 1 --format=%H "$after" -- ios/ || true)"
              fi
            fi
          fi

          if printf '%s\n' "$files" | grep -q '^ios/'; then
            if [ -z "$ios_sha" ]; then
              ios_sha="${head:-${after:-}}"
            fi
            echo "ios_changed=true" >> "$GITHUB_OUTPUT"
            echo "ios_sha=$ios_sha" >> "$GITHUB_OUTPUT"
          else
            echo "ios_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pass when no iOS files changed
        if: steps.changes.outputs.ios_changed == 'false'
        run: echo "No ios/ changes; Xcode Cloud is not required."

      - name: Wait for Xcode Cloud
        if: steps.changes.outputs.ios_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          XCODE_CONTEXT: ElRoysManagerApp | Branch Protection
          SHA: ${{ steps.changes.outputs.ios_sha }}
        run: |
          set -euo pipefail

          echo "ios/ changed; waiting for Xcode Cloud status: $XCODE_CONTEXT"
          echo "Commit: $SHA"

          deadline=$((SECONDS + 3600))

          while [ "$SECONDS" -lt "$deadline" ]; do
            state="$(XCODE_CONTEXT="$XCODE_CONTEXT" gh api repos/${{ github.repository }}/commits/$SHA/status \
              --jq '
                .statuses
                | map(select(.context == env.XCODE_CONTEXT))
                | sort_by(.updated_at)
                | last
                | .state // "missing"
              ')"

            echo "Xcode Cloud state: $state"

            case "$state" in
              success)
                echo "Xcode Cloud passed."
                exit 0
                ;;
              failure|error)
                echo "Xcode Cloud failed."
                exit 1
                ;;
              pending|missing)
                sleep 30
                ;;
              *)
                echo "Unexpected Xcode Cloud state: $state"
                sleep 30
                ;;
            esac
          done

          echo "Timed out waiting for Xcode Cloud."
          exit 1
